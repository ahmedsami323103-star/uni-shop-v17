<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uni Shop Payment Result</title><style>body{font:16px/1.6 system-ui;background:#f4f7f6;color:#202a36;margin:0;display:grid;min-height:100vh;place-items:center}.card{max-width:520px;background:#fff;border:1px solid #e1e7e6;border-radius:18px;padding:28px;margin:18px;box-shadow:0 10px 30px #102b4910}h1{color:#102b49}a{color:#078f88;font-weight:700}</style><div class="card"><h1 id="title">Checking payment…</h1><p id="message">The store verifies the payment with UddoktaPay before marking it paid. Please do not treat a redirect alone as proof of payment.</p><a href="/">Return to Uni Shop</a></div><script>const p=new URLSearchParams(location.search);if(p.get('status')==='paid'){document.querySelector('#title').textContent='Payment verified';document.querySelector('#message').textContent='Your payment was verified by the server. Order reference: '+(p.get('order')||'—')}else{document.querySelector('#title').textContent='Payment not verified';document.querySelector('#message').textContent='We could not confirm this payment yet. Please contact Uni Shop with your order reference: '+(p.get('order')||'—')}</script></html>
