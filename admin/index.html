<body><div class="shell"><aside class="side" id="sidebar"><div class="brand"><div class="logo">U</div><div>Uni Shop <small style="display:block;color:#88899b;font-size:10px;letter-spacing:1px">PRO ADMIN</small></div></div><div class="store"><div class="logo" style="width:34px;height:34px;border-radius:10px;font-size:13px">US</div><div><b>Uni Shop</b><small>unishop14.site</small></div><span style="margin-left:auto">⌄</span></div><div class="nav-label">OVERVIEW</div><button class="nav active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button><button class="nav" data-page="orders"><span class="ico">▤</span> Orders <span class="count" id="orderCount">—</span></button><button class="nav" data-page="products"><span class="ico">▧</span> Products</button><button class="nav" data-page="customers"><span class="ico">♙</span> Customers</button><div class="nav-label">GROW YOUR STORE</div><button class="nav" data-page="connect"><span class="ico">⌘</span> Connect</button><button class="nav" data-page="dropshipping"><span class="ico">⇄</span> Dropshipping</button><button class="nav" data-page="offers"><span class="ico">％</span> Offers</button><button class="nav" data-page="marketing"><span class="ico">↗</span> Marketing & SEO</button><div class="nav-label">STORE EXPERIENCE</div><button class="nav" data-page="design"><span class="ico">◩</span> Store design</button><button class="nav" data-page="pages"><span class="ico">▣</span> Pages</button><button class="nav" data-page="domains"><span class="ico">◎</span> Domains</button><button class="nav" data-page="qrcode"><span class="ico">▦</span> QR code</button><div class="nav-label">CONFIGURATION</div><button class="nav" data-page="payments"><span class="ico">৳</span> Payments</button><button class="nav" data-page="settings"><span class="ico">⚙</span> Settings</button><button class="nav" data-page="access"><span class="ico">♧</span> Access & team</button><div class="nav-label">ACCOUNT</div><button class="nav" data-page="help"><span class="ico">?</span> Help center</button><button class="nav" data-page="api"><span class="ico">⌁</span> API & integrations</button><div style="padding:16px 8px;color:#a0a0b0;font-size:11px">Uni Shop Admin • Prototype v1</div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-toggle" id="menuToggle">☰</button><div><div class="crumb">Uni Shop / <span id="crumb">Dashboard</span></div><h1 id="topTitle">Dashboard</h1></div></div><div class="top-right"><button class="iconbtn" title="Preview store" onclick="showPage('design')">↗</button><button class="iconbtn" title="Notifications" onclick="toast('নতুন নোটিফিকেশন নেই')">♧</button><div class="avatar">A</div></div></header><section class="content" id="content"></section></main></div><nav class="mobilebar"><button data-page="dashboard" class="active"><span>▦</span>Home</button><button data-page="orders"><span>▤</span>Orders</button><button data-page="products"><span>▧</span>Products</button><button data-page="customers"><span>♙</span>Customers</button><button id="mobileMore"><span>☰</span>More</button></nav><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];let currentPage='dashboard',orders=[],products=[],settings={},customers=[],apiOnline=false;const API='';
const labels={dashboard:'Dashboard',orders:'Orders',products:'Products',customers:'Customers',connect:'Connect',dropshipping:'Dropshipping',offers:'Offers',marketing:'Marketing & SEO',design:'Store design',pages:'Pages',domains:'Domains',qrcode:'QR code',payments:'Payments',settings:'Settings',access:'Access & team',help:'Help center',api:'API & integrations'};
function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}function date(s){try{return new Date(s).toLocaleString('en-BD',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return '—'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pillStatus(s){const map={pending:['Pending','amber'],processing:['Processing',''],shipped:['Shipped',''],delivered:['Delivered','green'],cancelled:['Cancelled','red'],paid:['Paid','green'],unpaid:['Unpaid','amber'],cash_on_delivery:['Cash on delivery','gray']};let x=map[s]||[s||'Unknown','gray'];return `<span class="pill ${x[1]}">${x[0]}</span>`}function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
async function api(path,opts={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data;try{data=await r.json()}catch{data={}}if(!r.ok)throw new Error(data.error||('Request failed ('+r.status+')'));return data}
async function loadData(){try{await api('/api/admin/me');apiOnline=true;const [o,p,s,c]=await Promise.all([api('/api/admin/orders'),api('/api/admin/products'),api('/api/admin/settings'),api('/api/admin/customers')]);orders=Array.isArray(o)?o:[];products=Array.isArray(p)?p:[];settings=s||{};customers=Array.isArray(c)?c:[];$('#orderCount').textContent=orders.length;return true}catch(e){apiOnline=false;orders=[];products=[];settings={};customers=[];$('#orderCount').textContent='—';return false}}
function showLogin(message=''){document.body.classList.add('login-required');let root=document.getElementById('loginRoot');if(!root){root=document.createElement('div');root.id='loginRoot';document.body.appendChild(root)}root.innerHTML=`<div class="login-screen"><form class="login-card" id="adminLoginForm"><div class="logo login-logo">U</div><h1>Uni Shop Admin</h1><p>অ্যাডমিন প্যানেলে প্রবেশ করতে লগইন করো</p><div id="loginError" class="login-error">${esc(message)}</div><label for="loginUsername">Username</label><input id="loginUsername" name="username" autocomplete="username" required><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button class="btn primary login-submit" type="submit">লগইন করো</button><small>শুধু অনুমোদিত অ্যাডমিন প্রবেশ করতে পারবেন।</small></form></div>`;document.getElementById('adminLoginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='লগইন হচ্ছে…';document.getElementById('loginError').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('loginUsername').value.trim(),password:document.getElementById('loginPassword').value})});const ok=await loadData();if(!ok)throw new Error('লগইন সেশন যাচাই করা যায়নি। আবার চেষ্টা করো।');document.body.classList.remove('login-required');root.remove();render()}catch(err){document.getElementById('loginError').textContent=err.message||'লগইন ব্যর্থ হয়েছে';btn.disabled=false;btn.textContent='লগইন করো'}})}

function header(title,sub,action=''){return `<div class="page-head"><div><h2>${title}</h2><p class="sub">${sub}</p></div>${action}</div>`}function stat(title,val,icon,trend){return `<div class="card"><div class="stat-top"><span>${title}</span><span class="stat-ico">${icon}</span></div><div class="metric">${val}</div><div class="trend">${trend}</div></div>`}function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function render(){ $('#topTitle').textContent=labels[currentPage]||currentPage;$('#crumb').textContent=labels[currentPage]||currentPage;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));$$('.mobilebar button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));$('#content').innerHTML=pages[currentPage]?pages[currentPage]():pages.dashboard();bindPage();}
function showPage(p){currentPage=p;$('#sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function bindPage(){ $$('#content [data-action]').forEach(b=>b.addEventListener('click',()=>actions(b.dataset.action,b.dataset.id,b)));$$('#content [data-nav]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.nav)));$$('#content [data-filter]').forEach(el=>el.addEventListener('input',()=>filterTable(el.dataset.filter,el.value))); }
const pages={
dashboard:()=>{let revenue=orders.filter(o=>o.payment_status==='paid'||o.payment_status==='cash_on_delivery').reduce((a,o)=>a+Number(o.total||0),0);let recent=orders.slice(0,5).map(o=>`<tr><td><b>${esc(o.id)}</b><div class="muted">${date(o.created_at)}</div></td><td>${esc(o.customer?.name||'Customer')}</td><td>${money(o.total)}</td><td>${pillStatus(o.status)}</td><td><button class="btn" data-action="order" data-id="${esc(o.id)}">View</button></td></tr>`).join('');return `${header('Good day, Admin 👋','এখান থেকে তোর স্টোরের পুরো কার্যক্রম এক নজরে দেখ।',`<button class="btn primary" data-action="new-product">＋ Add product</button>`)}<div class="grid stats">${stat('Total orders',orders.length,'▤','↑ Store order count')}${stat('Gross sales',money(revenue),'৳','Based on loaded orders')}${stat('Products',products.length,'▧','Catalog items')}${stat('Pending orders',orders.filter(o=>o.status==='pending').length,'◷','Needs attention')}</div><div class="grid dashboard-grid"><div class="card"><div class="card-title"><div><h3>Sales overview</h3><p>Illustrative weekly view • connect analytics for live totals</p></div><select class="field" style="padding:7px"><option>This week</option><option>This month</option></select></div><div class="chart">${[40,65,48,80,55,90,69].map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${v*.7}%"></div><div class="bar" style="height:${v}%"></div><div class="bar-label">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Revenue</span><span><i class="dot pale"></i>Orders</span></div></div><div class="card"><div class="card-title"><div><h3>Store checklist</h3><p>Finish setup to launch smoothly</p></div><span class="pill amber">Setup</span></div>${[['✓','Add products',products.length>0],['৳','Configure payments',settings.online_payment_enabled==='true'],['◎','Connect domain',false],['✉','Order notifications',false]].map(a=>`<div class="setting-row"><div style="display:flex;gap:10px;align-items:center"><span class="stat-ico">${a[0]}</span><div><b>${a[1]}</b><div class="muted" style="font-size:11px">${a[2]?'Completed':'Recommended next step'}</div></div></div><button class="btn ${a[2]?'':'soft'}" data-nav="${a[1].includes('payment')?'payments':a[1].includes('domain')?'domains':a[1].includes('notification')?'settings':'products'}">${a[2]?'Review':'Set up'}</button></div>`).join('')}</div></div><div class="card" style="margin-top:18px"><div class="card-title"><div><h3>Recent orders</h3><p>Latest order activity</p></div><button class="btn soft" data-nav="orders">View all orders →</button></div>${table(['Order','Customer','Total','Status','Action'],recent||'<tr><td colspan="5">No orders loaded</td></tr>')}</div>`},
orders:()=>`${header('Orders','সব অর্ডার দেখ, কাস্টমার ও ঠিকানা যাচাই কর, স্ট্যাটাস আপডেট কর।',`<button class="btn" data-action="refresh">↻ Refresh</button>`)}<div class="filters"><input class="field search" data-filter="orders" placeholder="Search order, customer, phone…"><select class="field" id="statusFilter" onchange="filterOrders()"><option value="">All statuses</option><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select><button class="btn" data-action="export-orders">↓ Export CSV</button></div><div class="notice" id="apiNotice">${apiOnline?'Live API connected — changes save to the server.':'Preview mode — demo orders shown. Log in to admin and connect API to load real orders.'}</div><div class="order-grid" id="orderGrid">${orders.map(orderCard).join('')||'<div class="card empty">কোনো অর্ডার পাওয়া যায়নি। API সংযোগ যাচাই কর।</div>'}</div>`,
products:()=>`${header('Products','পণ্য, দাম, স্টক ও ক্যাটাগরি পরিচালনা কর।',`<button class="btn primary" data-action="new-product">＋ Add product</button>`)}<div class="filters"><input class="field search" data-filter="products" placeholder="Search products or SKU…"><button class="btn" data-action="refresh">↻ Refresh</button><button class="btn" data-action="export-products">↓ Export CSV</button></div><div class="card">${table(['Product','SKU','Category','Price','Stock','Status','Action'],products.map(p=>`<tr><td><div class="product"><div class="thumb">▧</div><b>${esc(p.title||p.name)}</b></div></td><td>${esc(p.sku)}</td><td>${esc(p.category||'—')}</td><td><b>${money(p.price)}</b></td><td>${Number(p.stock||0)}</td><td>${Number(p.active)===0?pillStatus('cancelled'):pillStatus('delivered')}</td><td><button class="btn" data-action="edit-product" data-id="${esc(p.sku)}">Edit</button></td></tr>`).join(''))}</div>`,
customers:()=>`${header('Customers','কাস্টমার রেকর্ড, যোগাযোগ ও অর্ডার হিস্ট্রি।',`<button class="btn" data-action="refresh">↻ Refresh</button>`)}<div class="grid stats">${stat('Customers',customers.length||'—','♙','Loaded from connected customer API')}${stat('Repeat customers','—','↻','Requires customer analytics')}${stat('Customer value','—','৳','Requires complete order history')}${stat('Newsletter','—','✉','Configure in Settings')}</div><div class="card">${customers.length?table(['Customer','Email','Phone','Joined'],customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone||'—')}</td><td>${date(c.created_at)}</td></tr>`).join('')):`<div class="empty"><div class="big">♙</div><b>কোনো কাস্টমার রেকর্ড পাওয়া যায়নি</b><p>কাস্টমার থাকলে Refresh চাপো। নতুন অর্ডার/রেজিস্ট্রেশন হলে এখানে রেকর্ড দেখা যাবে।</p></div>`}</div>`,
connect:()=>`${header('Connect','বাইরের সার্ভিস ও চ্যানেল সংযুক্ত কর।',`<button class="btn" data-action="integration-help">Integration guide</button>`)}<div class="notice">এই কার্ডগুলো সেটআপের প্রবেশদ্বার। সার্ভিস কানেক্ট করতে তাদের অনুমোদিত API/OAuth credentials ও backend callback লাগবে।</div><div class="grid connect-grid">${[['🛍️','Sales channels','Connect marketplace and social selling.'],['📦','Product suppliers','Sync supplier catalog and inventory.'],['✉️','Email marketing','Newsletter and abandoned cart flows.'],['📊','Analytics','Track conversion, visits and revenue.'],['🚚','Shipping partners','Create shipment and tracking updates.'],['🔗','Custom API','Connect your own service endpoint.']].map((x,i)=>`<div class="connect-card"><div class="connect-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn soft" data-action="connect" data-id="${x[1]}">Configure →</button></div>`).join('')}</div>`,
dropshipping:()=>`${header('Dropshipping','সাপ্লায়ার ক্যাটালগ, ইমপোর্ট কিউ এবং অর্ডার ফরওয়ার্ডিং।',`<button class="btn primary" data-action="import-product">＋ Import product</button>`)}<div class="grid stats">${stat('Imported products','0','▧','No supplier connected')}${stat('Pending imports','0','◷','Review before publishing')}${stat('Forwarded orders','0','⇄','Requires supplier API')}${stat('Supplier status','Not set','⌁','Connect supplier first')}</div><div class="card"><div class="card-title"><div><h3>Supplier connections</h3><p>Connect a supplier before syncing live products or forwarding orders.</p></div><button class="btn primary" data-action="connect" data-id="Dropshipping supplier">＋ Add supplier</button></div><div class="empty"><div class="big">⇄</div><b>No supplier connected yet</b><p>Supplier API credentials, mapping and order-forwarding rules need to be configured securely on the server.</p></div></div><div class="card" style="margin-top:16px"><h3>Import workflow</h3><div class="grid stats" style="margin-top:14px">${[['1','Connect supplier'],['2','Map price and stock'],['3','Review product import'],['4','Enable order forwarding']].map(x=>`<div class="connect-card"><div class="stat-ico">${x[0]}</div><b style="display:block;margin-top:12px">${x[1]}</b></div>`).join('')}</div></div>`,
offers:()=>`${header('Offers','কুপন, ডিসকাউন্ট ও প্রচারণার অফার তৈরি কর।',`<button class="btn primary" data-action="new-offer">＋ Create offer</button>`)}<div class="grid stats">${stat('Active offers','0','％','No offer records yet')}${stat('Scheduled','0','◷','Plan future promotions')}${stat('Redemptions','—','✓','Requires coupon backend')}${stat('Discount sales','—','৳','Requires order attribution')}</div><div class="card"><div class="empty"><div class="big">％</div><b>No offers created</b><p>এই UI-তে অফার তৈরি করার ফর্ম আছে; বাস্তব checkout-এ coupon প্রয়োগ করতে backend validation/discount logic যোগ করতে হবে।</p><button class="btn primary" data-action="new-offer">Create your first offer</button></div></div>`,
marketing:()=>`${header('Marketing & SEO','স্টোরের SEO, campaign ও tracking সেটিংস।') }<div class="grid settings-grid"><div class="card"><div class="card-title"><h3>Search engine optimization</h3><span class="pill">SEO</span></div><div class="form-group"><label>Meta title</label><input id="seoTitle" placeholder="Uni Shop — Quality products"></div><div class="form-group" style="margin-top:12px"><label>Meta description</label><textarea id="seoDesc" placeholder="Describe your store for search engines"></textarea></div><div class="form-group" style="margin-top:12px"><label>Social sharing image URL</label><input placeholder="https://…"></div><button class="btn primary" style="margin-top:14px" data-action="save-seo">Save SEO settings</button></div><div class="card"><h3>Marketing integrations</h3>${[['Google Analytics','Track traffic and conversion'],['Meta Pixel','Measure social ad events'],['Email campaigns','Newsletter and campaign tools'],['Sitemap','Help search engines discover pages']].map(x=>`<div class="setting-row"><div><b>${x[0]}</b><div class="muted">${x[1]}</div></div><button class="btn soft" data-action="connect" data-id="${x[0]}">Set up</button></div>`).join('')}</div></div>`,
design:()=>`${header('Store design','থিম ও storefront preview। প্রকাশ করার আগে আলাদা করে যাচাই কর।',`<button class="btn primary" data-action="publish-theme">Save design</button>`)}<div class="grid dashboard-grid"><div class="card"><div class="card-title"><div><h3>Theme library</h3><p>Pick a visual direction for your storefront</p></div><span class="pill green">Current preview</span></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${[['Modern Minimal','#eeeaff'],['Bold Commerce','#fbe7dd'],['Fresh Market','#e0f5e9'],['Dark Premium','#29283d']].map((t,i)=>`<button class="connect-card" data-action="theme" data-id="${i}" style="text-align:left;border:2px solid ${i===0?'var(--purple)':'var(--line)'}"><div style="height:70px;border-radius:10px;background:${t[1]};margin-bottom:12px"></div><b>${t[0]}</b><div class="muted" style="font-size:11px">${i===0?'Selected preview':'Theme preview'}</div></button>`).join('')}</div><div class="form-group" style="margin-top:16px"><label>Primary color</label><input type="color" value="#5b45e8" id="themeColor" style="height:42px;padding:4px"></div></div><div><div class="card-title"><h3>Live storefront preview</h3><button class="btn" data-action="open-store">↗ Open store</button></div><div class="preview-store"><div class="preview-banner"><div style="font-weight:900;font-size:20px">UNI SHOP</div><p>Everyday essentials, delivered to you.</p><button class="btn primary">Shop collection</button></div><div class="preview-products">${sampleProducts.slice(0,3).map(p=>`<div class="preview-prod"><div class="thumb">▧</div><b>${p.title}</b><div style="color:var(--purple);margin-top:5px">${money(p.price)}</div></div>`).join('')}</div></div><p class="footnote">Preview mockup only; publishing a theme requires wiring this selection into public storefront CSS/templates.</p></div></div>`,
pages:()=>`${header('Pages','স্টোরের পলিসি, FAQ ও কাস্টম কনটেন্ট পেজ।',`<button class="btn primary" data-action="new-page">＋ Add page</button>`)}<div class="card">${table(['Page','URL','Visibility','Action'],[['Home','/','Published'],['Privacy Policy','/privacy-policy.html','Published'],['Contact Us','/contact.html','Published'],['FAQ / Help','/faq.html','Published'],['Terms & Conditions','/terms.html','Published'],['Returns & Refunds','/returns.html','Published']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${pillStatus('delivered')}</td><td><button class="btn" data-action="edit-page" data-id="${x[0]}">Edit</button></td></tr>`).join(''))}</div>`,
domains:()=>`${header('Domains','কাস্টম ডোমেইন ও DNS সংযোগের অবস্থা।') }<div class="grid settings-grid"><div class="card"><h3>Connected domain</h3><div style="font-size:22px;font-weight:850;margin:14px 0">unishop14.site</div>${pillStatus('delivered')}<p class="muted">Existing public domain • verify DNS/SSL at hosting provider</p><button class="btn" data-action="domain-check">Check domain setup</button></div><div class="card"><h3>Connect another domain</h3><div class="form-group" style="margin-top:14px"><label>Domain name</label><input placeholder="shop.example.com"></div><button class="btn primary" style="margin-top:12px" data-action="domain-add">Add domain</button><p class="footnote">Adding here does not alter DNS. Configure records at your domain registrar and hosting provider.</p></div></div>`,
qrcode:()=>`${header('QR code','স্টোরের লিংকের জন্য QR code preview।') }<div class="card" style="max-width:680px;margin:auto;text-align:center;padding:28px"><div style="font-size:70px">▦</div><h3>Uni Shop QR code</h3><p class="muted">https://unishop14.site</p><div id="qrPattern" style="width:190px;height:190px;margin:20px auto;background:repeating-conic-gradient(#24243a 0 25%,white 0 50%) 0/18px 18px;border:10px solid white;outline:1px solid #ddd;border-radius:5px"></div><button class="btn primary" data-action="download-qr">Download QR preview</button><p class="footnote">Visual placeholder, not a scannable generated QR code. Use a QR library/service to generate the production code.</p></div>`,
payments:()=>`${header('Payments','Cash on Delivery, bKash/Nagad via UddoktaPay এবং অনলাইন পেমেন্ট কনফিগারেশন।',`<button class="btn primary" data-action="save-settings">Save changes</button>`)}<div class="notice">API keys কখনো এই HTML-এ বা chat-এ রাখিস না। Render-এর Environment Variables-এ secret key সেট করতে হবে।</div><div class="grid settings-grid"><div class="card"><h3>Payment methods</h3>${[['Cash on Delivery','cod_enabled'],['bKash','bkash_enabled'],['Nagad','nagad_enabled'],['Online payment checkout','online_payment_enabled']].map(x=>`<div class="setting-row"><div><b>${x[0]}</b><div class="muted">${x[1]==='online_payment_enabled'?'Server credentials required':'Enable/disable checkout method'}</div></div><button class="toggle ${settings[x[1]]==='true'?'on':''}" data-action="toggle-setting" data-id="${x[1]}" aria-label="Toggle ${x[0]}"></button></div>`).join('')}</div><div class="card"><h3>Gateway configuration checklist</h3>${[['UDDOKTAPAY_API_KEY','Secret API key'],['UDDOKTAPAY_DEFAULT_EMAIL','Gateway contact email'],['UDDOKTAPAY_BASE_URL','Sandbox/live base URL'],['PUBLIC_BASE_URL','Public site URL']].map(x=>`<div class="setting-row"><div><b>${x[0]}</b><div class="muted">${x[1]}</div></div>${pillStatus('pending')}</div>`).join('')}<p class="footnote">Secret values are intentionally not returned by /api/admin/settings. Configure via Render Environment.</p></div></div>`,
settings:()=>`${header('Settings','স্টোর তথ্য, ডেলিভারি, নোটিফিকেশন ও সাধারণ কনফিগারেশন।',`<button class="btn primary" data-action="save-settings">Save settings</button>`)}<div class="grid settings-grid"><div class="card"><h3>Store details</h3><div class="form-grid" style="margin-top:14px"><div class="form-group"><label>Store name</label><input id="s_shop_name" value="${esc(settings.shop_name||'Uni Shop')}"></div><div class="form-group"><label>Hotline number</label><input id="s_hotline_number" value="${esc(settings.hotline_number||'01758254433')}"></div><div class="form-group"><label>Delivery inside Dhaka (৳)</label><input id="s_delivery_inside_dhaka" type="number" value="${esc(settings.delivery_inside_dhaka||80)}"></div><div class="form-group"><label>Delivery outside Dhaka (৳)</label><input id="s_delivery_outside_dhaka" type="number" value="${esc(settings.delivery_outside_dhaka||150)}"></div></div></div><div class="card"><h3>Notifications & preferences</h3>${[['Newsletter enabled','newsletter_enabled'],['Cash on Delivery','cod_enabled'],['bKash checkout','bkash_enabled'],['Nagad checkout','nagad_enabled']].map(x=>`<div class="setting-row"><b>${x[0]}</b><button class="toggle ${settings[x[1]]!=='false'?'on':''}" data-action="toggle-setting" data-id="${x[1]}"></button></div>`).join('')}<div class="form-group" style="margin-top:12px"><label>Admin notification email (optional)</label><input id="s_admin_notification_email" value="${esc(settings.admin_notification_email||'')}" placeholder="orders@example.com"></div></div></div>`,
access:()=>`${header('Access & team','অ্যাডমিন অ্যাক্সেস ও নিরাপত্তা সংক্রান্ত নির্দেশনা।') }<div class="grid settings-grid"><div class="card"><h3>Admin account</h3><div class="setting-row"><div><b>Current admin</b><div class="muted">Session protected</div></div>${pillStatus('delivered')}</div><p class="muted">ADMIN_USERNAME এবং ADMIN_PASSWORD প্রথম সেটআপের সময় server environment-এ কনফিগার কর।</p><button class="btn" data-action="security-help">Security checklist</button></div><div class="card"><h3>Security checklist</h3>${['Strong unique admin password','Change SESSION_SECRET in production','Use HTTPS and persistent database disk','Keep API keys in environment variables','Review admin sessions and access'].map(x=>`<div class="setting-row"><span>✓ ${x}</span><span class="pill amber">Review</span></div>`).join('')}</div></div>`,
help:()=>`${header('Help center','সাধারণ troubleshooting এবং সেটআপ গাইড।') }<div class="grid settings-grid">${[['Orders not visible','Admin orders endpoint must return the saved SQLite records.'],['Order details missing','Checkout must send customer/address and the server must persist those fields.'],['Payment not starting','Check gateway credentials, enabled flag and public callback URL.'],['Data disappears after deploy','Attach a persistent disk and set DATABASE_FILE to its mount path.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('')}</div>`,
api:()=>`${header('API & integrations','বর্তমান server.js-এ থাকা API endpoint এবং production checklist।') }<div class="card">${table(['Endpoint','Purpose','Auth'],[['GET /api/health','Service health','Public'],['GET /api/products','Storefront product catalog','Public'],['GET /api/store-config','Public store config','Public'],['POST /api/orders','Create order','Customer session'],['POST /api/admin/login','Admin login','Public + rate limit'],['GET /api/admin/orders','List saved orders','Admin session'],['PATCH /api/admin/orders/:id','Update order status','Admin session'],['GET /api/admin/products','List products','Admin session'],['POST /api/admin/products','Create product','Admin session'],['PATCH /api/admin/products/:sku','Edit product','Admin session'],['GET/PATCH /api/admin/settings','Read/save store settings','Admin session'],['POST /api/payments/uddoktapay/webhook','Verify payment webhook','Gateway secret']].map(x=>`<tr><td><code>${x[0]}</code></td><td>${x[1]}</td><td>${pillStatus(x[2]==='Public'?'delivered':'processing')}</td></tr>`).join(''))}</div><div class="notice" style="margin-top:14px">Backend gaps identified from the supplied server.js: no admin customer-list route, no coupon/offer persistence, no supplier/dropshipping integration, no theme/page/domain mutation APIs, and no live analytics endpoint.</div>`};
function orderCard(o){let customer=o.customer||{},address=o.address||{},items=o.items||[];return `<article class="order-card" data-order-search="${esc([o.id,customer.name,customer.phone,address.fullAddress].join(' ').toLowerCase())}" data-order-status="${esc(o.status)}"><div class="order-top"><div><div class="order-id">${esc(o.id)}</div><div class="order-meta">${date(o.created_at)} · ${esc(o.payment_method||'—')}</div></div>${pillStatus(o.status)}</div><div class="order-person"><div class="person-avatar">${esc((customer.name||'C').slice(0,1).toUpperCase())}</div><div style="min-width:0"><b>${esc(customer.name||'Customer name missing')}</b><div class="muted">${esc(customer.phone||'Phone missing')}</div><div class="muted" style="font-size:11px">${esc([address.fullAddress,address.thana,address.district,address.division].filter(Boolean).join(', ')||'Address missing')}</div></div></div><div class="order-items">${items.map(i=>`${esc(i.title||i.name||i.sku)} × ${Number(i.qty||1)} · ${money(i.price)}`).join('<br>')||'No items details'}</div><div class="order-bottom"><div><div class="muted" style="font-size:11px">ORDER TOTAL</div><b style="font-size:19px">${money(o.total)}</b><div class="muted" style="font-size:11px">Payment: ${pillStatus(o.payment_status||'unpaid')}</div></div><button class="btn" data-action="order" data-id="${esc(o.id)}">Details</button></div><div class="order-actions"><select class="field" id="status-${esc(o.id)}"><option value="pending" ${o.status==='pending'?'selected':''}>Pending</option><option value="processing" ${o.status==='processing'?'selected':''}>Processing</option><option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select><button class="btn primary" data-action="save-order" data-id="${esc(o.id)}">Save status</button></div></article>`}
function filterOrders(){let q=($('[data-filter="orders"]')?.value||'').toLowerCase(),s=$('#statusFilter')?.value||'';$$('.order-card').forEach(c=>c.classList.toggle('hidden',!(c.dataset.orderSearch||'').includes(q)||!!s&&c.dataset.orderStatus!==s))}function filterTable(type,q){if(type==='orders')filterOrders();if(type==='products'){$$('#content tbody tr').forEach(r=>r.classList.toggle('hidden',!r.innerText.toLowerCase().includes(q.toLowerCase())))}}
function modal(title,body,foot=''){ $('#modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}${foot}</div></div>`;$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}
function actions(action,id,el){const o=orders.find(x=>x.id===id);if(action==='refresh'){loadData().then(()=>{render();toast(apiOnline?'Live data refreshed':'API unavailable — showing preview data')})}else if(action==='save-order'){const s=$('#status-'+CSS.escape(id)).value;if(apiOnline){api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:s})}).then(()=>{let x=orders.find(o=>o.id===id);if(x)x.status=s;render();toast('Order status saved')}).catch(e=>toast(e.message))}else{if(o)o.status=s;render();toast('Preview only — not saved to server')}}else if(action==='order'&&o){modal('Order details',`<div class="grid settings-grid"><div class="card"><div class="muted">Order ID</div><b>${esc(o.id)}</b><div style="margin-top:12px">${pillStatus(o.status)}</div><div style="margin-top:12px">${pillStatus(o.payment_status)}</div></div><div class="card"><div class="muted">Total</div><div class="metric">${money(o.total)}</div><div>${esc(o.payment_method)}</div></div></div><div class="card" style="margin-top:14px"><h3>Customer & delivery</h3><p><b>${esc(o.customer?.name||'—')}</b><br>${esc(o.customer?.phone||'—')}<br>${esc([o.address?.fullAddress,o.address?.thana,o.address?.district,o.address?.division].filter(Boolean).join(', ')||'Address missing')}</p></div><div class="card" style="margin-top:14px"><h3>Items</h3>${(o.items||[]).map(i=>`<div class="setting-row"><span>${esc(i.title||i.sku)} × ${i.qty}</span><b>${money(i.price*Number(i.qty||1))}</b></div>`).join('')}<div class="setting-row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="setting-row"><span>Delivery</span><b>${money(o.delivery)}</b></div><div class="setting-row"><b>Total</b><b>${money(o.total)}</b></div></div>`)}else if(action==='new-product'||action==='edit-product'){let p=products.find(x=>x.sku===id)||{};modal(action==='edit-product'?'Edit product':'Add product',`<div class="form-grid"><div class="form-group"><label>SKU</label><input id="p_sku" value="${esc(p.sku||'')}" ${p.sku?'readonly':''}></div><div class="form-group"><label>Product title</label><input id="p_title" value="${esc(p.title||p.name||'')}"></div><div class="form-group"><label>Price (৳)</label><input id="p_price" type="number" min="0" value="${esc(p.price||'')}"></div><div class="form-group"><label>Compare price (৳)</label><input id="p_compare" type="number" min="0" value="${esc(p.compare_price||'')}"></div><div class="form-group"><label>Category</label><input id="p_category" value="${esc(p.category||'')}"></div><div class="form-group"><label>Stock</label><input id="p_stock" type="number" min="0" value="${esc(p.stock??0)}"></div><div class="form-group span2"><label>Image URL</label><input id="p_image" value="${esc(p.image||'')}"></div></div><p class="footnote">Save uses the existing admin product API when connected.</p><button class="btn primary" style="margin-top:16px" onclick="saveProduct('${action==='edit-product'?'edit':'new'}')">Save product</button>`)}else if(action==='save-settings'){saveSettings()}else if(action==='toggle-setting'){let k=id;settings[k]=settings[k]==='true'?'false':'true';if(apiOnline){api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({[k]:settings[k]})}).then(()=>{render();toast('Setting saved')}).catch(e=>toast(e.message))}else{render();toast('Preview only — setting not saved to server')}}else if(action==='export-orders'){downloadCSV('orders.csv',orders.map(o=>({id:o.id,status:o.status,customer:o.customer?.name,phone:o.customer?.phone,total:o.total,payment:o.payment_method,created_at:o.created_at})))}else if(action==='export-products'){downloadCSV('products.csv',products)}else if(action==='connect'||action==='integration-help'){modal('Configure '+(id||'integrations'),`<div class="notice">নিরাপত্তার জন্য secret/API key এই HTML ফাইলে রাখা হবে না। Provider dashboard থেকে API credentials নিয়ে server environment-এ সংরক্ষণ কর।</div><div class="form-group"><label>Provider / integration</label><input value="${esc(id||'Custom integration')}" readonly></div><div class="form-group" style="margin-top:12px"><label>Callback / documentation URL (optional)</label><input placeholder="https://provider.example/docs"></div><p class="footnote">এই ফর্ম configuration note হিসেবে কাজ করে; provider-এর আসল OAuth/API connection এখনও backend-এ implement করতে হবে।</p><button class="btn primary" style="margin-top:14px" onclick="closeModal();toast('Integration checklist noted')">Done</button>`)}else if(action==='import-product'){modal('Import supplier product',`<div class="notice">লাইভ import করার আগে supplier API/CSV format লাগবে।</div><div class="form-group"><label>Supplier product URL or SKU</label><input id="supplierProduct" placeholder="Supplier product URL / SKU"></div><div class="form-group" style="margin-top:12px"><label>Retail markup (%)</label><input id="markup" type="number" value="25"></div><button class="btn primary" style="margin-top:14px" onclick="closeModal();toast('Supplier integration backend required')">Continue</button>`)}else if(action==='new-offer'){modal('Create offer',`<div class="form-grid"><div class="form-group"><label>Offer name</label><input id="offerName" placeholder="Eid Sale"></div><div class="form-group"><label>Coupon code</label><input id="offerCode" placeholder="EID10"></div><div class="form-group"><label>Discount type</label><select id="offerType"><option>Percentage</option><option>Fixed amount</option></select></div><div class="form-group"><label>Discount value</label><input id="offerValue" type="number" placeholder="10"></div><div class="form-group"><label>Start date</label><input type="date"></div><div class="form-group"><label>End date</label><input type="date"></div></div><p class="footnote">Offer form preview only; checkout discount logic needs backend implementation.</p><button class="btn primary" style="margin-top:14px" onclick="closeModal();toast('Offer UI saved as a draft preview only')">Save draft</button>`)}else if(action==='new-page'||action==='edit-page'){modal(action==='new-page'?'Create page':'Edit page: '+id,`<div class="form-group"><label>Page title</label><input id="pageTitle" value="${esc(id==='edit-page'?'':id||'')}"></div><div class="form-group" style="margin-top:12px"><label>Page content</label><textarea id="pageContent" placeholder="Write page content…"></textarea></div><button class="btn primary" style="margin-top:14px" onclick="closeModal();toast('Page editor preview only — publish API required')">Save draft</button>`)}else if(action==='theme'){toast('Theme preview selected — connect to storefront before publishing')}else if(action==='publish-theme'){toast('Design preview saved locally; publishing API not available yet')}else if(action==='open-store'){window.open('https://unishop14.site','_blank')}else if(action==='domain-check'){toast('DNS/SSL status must be verified at your host')}else if(action==='domain-add'){toast('Configure DNS and hosting first')}else if(action==='download-qr'){toast('Production QR generator not connected')}else if(action==='save-seo'){toast('SEO UI preview; persistence route not yet available')}else if(action==='security-help'){modal('Security checklist',`<ul><li>Set strong ADMIN_PASSWORD in Render environment.</li><li>Change SESSION_SECRET.</li><li>Use a persistent disk for SQLite.</li><li>Never expose API keys in browser JavaScript.</li><li>Use HTTPS and review session/cookie settings.</li></ul>`)} }
function saveProduct(mode){const p={sku:$('#p_sku').value.trim(),title:$('#p_title').value.trim(),price:Number($('#p_price').value),compare:Number($('#p_compare').value||0),category:$('#p_category').value.trim(),stock:Number($('#p_stock').value||0),image:$('#p_image').value.trim()};if(!p.sku||!p.title||!Number.isFinite(p.price)||p.price<0||p.stock<0)return toast('SKU, title, price ও stock ঠিক করে দে');if(!apiOnline){products.push({...p,active:1});closeModal();render();return toast('Preview only — product not saved to server')}let url=mode==='edit'?'/api/admin/products/'+encodeURIComponent(p.sku):'/api/admin/products',method=mode==='edit'?'PATCH':'POST';api(url,{method,body:JSON.stringify(p)}).then(()=>loadData()).then(()=>{closeModal();render();toast('Product saved')}).catch(e=>toast(e.message))}
async function saveSettings(){let data={};['shop_name','hotline_number','delivery_inside_dhaka','delivery_outside_dhaka','admin_notification_email'].forEach(k=>{let el=$('#s_'+k);if(el)data[k]=el.value});['cod_enabled','bkash_enabled','nagad_enabled','online_payment_enabled','newsletter_enabled'].forEach(k=>{if(settings[k]!==undefined)data[k]=settings[k]});if(!apiOnline){Object.assign(settings,data);return toast('Preview only — settings not saved to server')}try{await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify(data)});Object.assign(settings,data);toast('Settings saved');render()}catch(e){toast(e.message)}}function downloadCSV(name,rows){if(!rows.length)return toast('No data to export');let keys=[...new Set(rows.flatMap(Object.keys))];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
const initPage=new URLSearchParams(location.search).get('page');if(labels[initPage])currentPage=initPage;$$('.nav').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#mobileMore').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$$('.mobilebar button[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));loadData().then(ok=>{if(ok)render();else showLogin()});
</script></body></html>
